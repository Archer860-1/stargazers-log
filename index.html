<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stargazers log</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page" lang="en">
    <p class="eyebrow">Repository activity / 2026</p>
    <h1>Stargazers log</h1>
    <p class="intro">A log of the repositories I've starred.</p>

    <!-- Accessible, live-updating region for repository events -->
    <section id="repository-list" class="list" aria-live="polite" aria-busy="true" role="region" aria-label="Starred repositories">
      <p class="status">Loading repository events...</p>
      <ul id="starred" class="starred-list"></ul>
    </section>
    <noscript>
      <p class="status">JavaScript is disabled. Please enable JavaScript to see the starred repositories.</p>
    </noscript>
  </main>

  <script src="script.js"></script>
</body>
</html>
